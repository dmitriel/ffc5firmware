# By using these files I affirm my respect for Ukraine's sovereignty and
# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-print-macros.cfg -- print-lifecycle macros for Mainsail/Moonraker prints.
#
# The touchscreen app implements ALL print-lifecycle behaviour itself and the
# Klipper fork ships no START/END/PAUSE/RESUME/CANCEL macros; these reproduce
# the app's sequences. See docs/notes/50-print-lifecycle.md.
#
# REQUIRED, not an optional drop-in. Needs [pause_resume], [virtual_sdcard]
# and ff-filament.cfg to EXIST but not to come first -- nothing here reads
# their config at parse time. [ff_print], declared at the end, wraps
# SDCARD_PRINT_FILE and M23 at klippy:connect so a print prepares the machine
# for itself with no slicer changes.
#
# Deliberate divergences from firmwareExe:
#   * resume reheats all tools in parallel, not e1+e2 then e3+e4 staged
#   * no dmesg/meminfo dumps, no drop_caches shell calls
#   * idle timeout after resume goes back to 864000 (app uses 600000)
#   * pause park height: the app's clamp formula was not recovered; we lift
#     +10 mm clamped to 256
#   * tool-presence gate (E0165): the app checks only the file's first tool at
#     prepare time; we refuse up front for every tool in TOOLS=
#   * nozzle clean temperatures come from the slicer (TEMPS=) or NOZZLE=, not
#     the touchscreen's material table; the purge height is ff-filament.cfg's
#     fixed purge_z, and the PA test-line variant is not reproduced
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# START_PRINT -- called for you by [ff_print]. In a slicer's machine start
# gcode instead, e.g. (OrcaSlicer):
#   START_PRINT BED=[bed_temperature_initial_layer_single] TOOL=[initial_extruder] \
#               NOZZLE=[nozzle_temperature_initial_layer] LAYER=[initial_layer_print_height] \
#               TOOLS=0:220,2:240
#   TOOLS  every tool the file uses, each with its clean temperature (a bare
#          "0,2" falls back to NOZZLE). Each must be docked or mounted or the
#          job is refused before any heating/homing (app: E0165).
#   TEMPS  positional override of the clean temperatures, indexed by tool
#          number (0 = fall back).
#   CLEAN  1 (default): every tool in TOOLS except TOOL is purged, wiped and
#          parked at temp - 100 while the bed heats; TOOL itself is purged and
#          wiped LAST, after the mesh, and stays mounted hot so the file starts
#          printing straight away. 0: no clean; TOOL is just grabbed.
#   PURGE  purge length in mm for every clean (default ff-filament.cfg's
#          purge_length, 50). 0 skips the purge and keeps the wipe.
#   SOAK   seconds to dwell after the bed reaches target (app: 5 min).
#   MESH   auto|off|fixed|adaptive|thermal for this print only; without it,
#          BED_MESH_MODE's choice (below).
# Every tool starts heating to temp - 100 at the very beginning, beside the bed.
#   LAYER  the FIRST layer's height ([ff_print] reads it from the file's first
#          ;HEIGHT:). The print Z offset and the flow mesh both use it.
# The tool the print starts with is left mounted at print temperature by its
# own clean; any wait for it is the sliced file's.
#
# NOZZLE/BED/LAYER feed TOOLCHANGE_SET_PRINT_OFFSET, the port of the app's
# absolute print Z offset terms: nozzle temperature, a bed at 100 C+, a first
# layer of 0.1 mm or less. The ~3.2 mm eddy-to-nozzle gap itself is carried
# by the tool's frame from the grab; this adds the small terms on top, with
# no motion, just before the last clean.
# ---------------------------------------------------------------------------
# _FF_PREFLIGHT TOOLS=<comma list> [TOOL=<n>] -- both pre-motion gates in one
# pass, refusing BEFORE any heating/homing/grab:
#   1. Calibration -- with no nozzle_z / station_z the print-start offset
#      cannot be computed. _FF_JOB.allow_uncalibrated overrides this gate only.
#   2. Tool presence -- a tool is available when its dock switch is pressed or
#      it is the one on the carriage.
[gcode_macro _FF_PREFLIGHT]
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' and s|trim|int not in tools %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% if tool >= 0 and tool not in tools %}{% set _ = tools.append(tool) %}{% endif %}
    {% set tc = printer.ff_toolchange %}
    {% set uncalibrated = [] %}
    {% set absent = [] %}
    {% for t in tools %}
        {% if t < 0 or t > 3 %}
            { action_raise_error("TOOLS: tool %s out of range 0..3" % t) }
        {% endif %}
        {% if t not in tc.calibrated_tools %}{% set _ = uncalibrated.append(t) %}{% endif %}
        {% if t not in tc.docked_tools and t != tc.current_tool %}{% set _ = absent.append(t) %}{% endif %}
    {% endfor %}
    {% set ok = (tools|length > 0 and uncalibrated|length == 0 and tc.station_z is not none)
                or (tools|length == 0 and tc.print_offset_ready) %}
    {% if not ok and not printer["gcode_macro _FF_JOB"].allow_uncalibrated %}
        { action_raise_error("Not calibrated: station_z=%s, calibrated tools %s, needed %s. "
            "Run TOOL_LOCATE_SENSOR / TOOL_CALIBRATE_TOOL_OFFSET (or FF_IMPORT_FIRMWARE_CONFIG) "
            "and SAVE_CONFIG. Without nozzle_z/station_z the print Z offset cannot be "
            "computed and the nozzle would be driven ~3 mm into the plate."
            % (tc.station_z, tc.calibrated_tools, tools)) }
    {% endif %}
    {% if tools|length > 0 and not tc.state_ok %}
        { action_raise_error("Toolchanger state not ok: %s" % tc.state_reason) }
    {% endif %}
    {% if absent|length > 0 %}
        { action_raise_error("Tool(s) %s not installed (dock switch not pressed, not mounted); "
            "docked %s, mounted T%s. Install them or re-slice without them."
            % (absent, tc.docked_tools, tc.current_tool)) }
    {% endif %}

# ---------------------------------------------------------------------------
# _FF_NOZZLE_CLEAN TOOLS=<list> [TEMPS=<list>] [TEMP=<fallback>]
#                  [MODE=standby|print|preheat] [PURGE=<mm>]
# Port of BuildPage::clearNozzlePrint @0x9f46f4. Per tool, in order: grab,
# travel to the purge chute, heat and wait (+-3 C), chamber fans off, purge
# PURGE mm (default purge_length, 50; 0 skips it) / part fan 60% / E-5,
# travel to the wipe spot and lower to clean_wipe_z, then by MODE:
#   standby  (the app's) cool to temp - clean_cool_delta so the ooze freezes
#            to the spot, part fan off, G1 Z10, release. The hotend is left
#            at temp - clean_cool_delta.
#   print    the tool the print starts with: no cool-down, no release -- it
#            lifts and stays mounted at print temperature, so the print can
#            start at once. The hot wipe tears off less ooze than the cold one.
#   preheat  no motion: only sets each tool to temp - clean_cool_delta.
# Each tool's temperature: TEMPS[tool] if given, else its material's
# (ff-filament.cfg), else TEMP. Uses ff-filament.cfg's helpers and tunables.
# ---------------------------------------------------------------------------
[gcode_macro _FF_NOZZLE_CLEAN]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set fallback = params.TEMP|default(ff.default_temp)|float %}
    {% set mode = params.MODE|default('standby')|string|lower %}
    {% set purge = params.PURGE|default(ff.purge_length)|float %}
    {% if mode not in ('standby', 'print', 'preheat') %}
        { action_raise_error("_FF_NOZZLE_CLEAN: MODE must be standby, print or preheat") }
    {% endif %}
    {% set tools = [] %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' and s|trim|int not in tools %}{% set _ = tools.append(s|trim|int) %}{% endif %}
    {% endfor %}
    {% set temps = [] %}
    {% for s in (params.TEMPS|default('')|string).split(',') %}
        {% if s|trim != '' %}{% set _ = temps.append(s|trim|float) %}{% endif %}
    {% endfor %}
    {% for tool in tools %}
        {% set mat = (ff.tool_material[tool]|upper) if tool < ff.tool_material|length else '' %}
        {% set by_material = ff.temps[mat] if mat in ff.temps else fallback %}
        {% set temp = temps[tool] if tool < temps|length and temps[tool] > 0 else by_material %}
        {% if mode == 'preheat' %}
            {% if temp - ff.clean_cool_delta > 0 %}
                M104 S{temp - ff.clean_cool_delta} T{tool}
            {% endif %}
        {% else %}
            {% set extruder = printer["tool T%d" % tool].extruder %}
            {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
            {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
            { action_respond_info("nozzle clean T%d at %.0f C%s" % (tool, temp,
                ", staying mounted to print" if mode == 'print' else "")) }
            _FF_FILAMENT_PREP TOOL={tool} TEMP={temp} ALLOW_PRINTING=1
            {% if purge > 0 %}
                SAVE_GCODE_STATE NAME=_ff_clean
                M83
                G92 E0
                G1 E{purge} F{speed}                 ; app: G92 E0; G1 E50 F<speed>; M400
                M400
                M106 P1 S{(ff.purge_fan * 255)|int}  ; app: M106 P1 S153
                G1 E-{ff.purge_retract} F{speed}     ; app: G92 E0; G1 E-5 F<speed>; M400
                M400
                G92 E0
                RESTORE_GCODE_STATE NAME=_ff_clean
            {% endif %}
            ; wipe at (266.5, 13.8), see ff-filament.cfg: cold for a standby
            ; tool, hot for the one the print starts with
            _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp} COOL={0 if mode == 'print' else 1}
            _FF_FILAMENT_FINISH RELEASE={0 if mode == 'print' else 1} HEAT_OFF=0
        {% endif %}
    {% endfor %}

[gcode_macro START_PRINT]
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set mesh = params.MESH|default(printer["gcode_macro BED_MESH_MODE"].mode)|string|lower %}
    {% set nozzle = params.NOZZLE|default(220)|float %}
    {% set layer = params.LAYER|default(0)|float %}
    {% set clean = params.CLEAN|default(1)|int %}
    {% set soak = params.SOAK|default(0)|float %}
    {% set purge = params.PURGE|default(-1)|float %}
    {% set purge_arg = (" PURGE=%s" % purge) if purge >= 0 else "" %}
    ; TOOLS takes "0,2" or, as the slicer emits it, "0:220,2:240" -- each used
    ; tool with its own clean temperature. TEMPS= (positional, 0 = use NOZZLE)
    ; is still accepted for files sliced before the paired form existed.
    {% set tools = [] %}
    {% set tmap = {} %}
    {% for s in (params.TOOLS|default('')|string).split(',') %}
        {% if s|trim != '' %}
            {% set pair = s.split(':') %}
            {% set t = pair[0]|trim|int %}
            {% if t not in tools %}{% set _ = tools.append(t) %}{% endif %}
            {% if pair|length > 1 and pair[1]|trim != '' %}
                {% set _ = tmap.update({t: pair[1]|trim|float}) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if tool >= 0 and tool not in tools %}{% set _ = tools.append(tool) %}{% endif %}
    {% set tool_list = tools|join(',') %}
    {% set others = [] %}
    {% for t in tools %}{% if t != tool %}{% set _ = others.append(t) %}{% endif %}{% endfor %}
    {% set temps = [tmap.get(0, 0), tmap.get(1, 0), tmap.get(2, 0), tmap.get(3, 0)]|join(',')
                   if tmap else params.TEMPS|default('')|string|trim %}
    _FF_PREFLIGHT TOOL={tool}{% if tool_list %} TOOLS={tool_list}{% endif %}
    G90
    M82
    BED_MESH_CLEAR
    {% if bed > 0 %}
        M140 S{bed}                      ; app: heatManager(bed) -- heating from
                                         ; before the homing, then through the clean
    {% endif %}
    {% if tools|length > 0 %}
        ; every tool towards temp - 100 at once, while homing and cleaning
        _FF_NOZZLE_CLEAN MODE=preheat TOOLS={tool_list}{% if temps %} TEMPS={temps}{% endif %} TEMP={nozzle}
    {% endif %}
    G28
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600
    SET_IDLE_TIMEOUT TIMEOUT=864000                  ; app value during print
    {% if clean and others|length > 0 %}
        _FF_NOZZLE_CLEAN TOOLS={others|join(',')}{% if temps %} TEMPS={temps}{% endif %} TEMP={nozzle}{purge_arg}
        M106 P1 S0                       ; app @0x9f27a4
    {% endif %}
    {% if bed > 0 %}
        M190 S{bed}
        {% if soak > 0 %}
            G4 P{(soak * 1000)|int}      ; heat soak (app: keepBedTempPrint = 5 min
                                         ; from the bed reaching target; SOAK=<s>)
        {% endif %}
        G28 Z                            ; app re-homes Z after the heat soak
    {% endif %}
    _FF_MESH MODE={mesh}
    G1 Z10 F1200                         ; clearance for the dock run: the raw
                                         ; eddy frame sits ~3.2 mm low, so
                                         ; nominal Z10 is ~6.8 mm physical
    ; The print Z offset's temperature/bed/first-layer terms, no motion. Set
    ; before the last clean: _FF_NOZZLE_WIPE takes the job term off its wipe
    ; height, so the wipe still lands on the spot.
    TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={layer}{% if tool >= 0 %} TOOL={tool}{% endif %}
    ; LAST: the tool the print starts with -- purged and wiped hot, left
    ; mounted, so the file's first move follows straight on.
    {% if tool >= 0 and clean %}
        _FF_NOZZLE_CLEAN MODE=print TOOLS={tool}{% if temps %} TEMPS={temps}{% endif %} TEMP={nozzle}{purge_arg}
    {% elif tool >= 0 %}
        M104 S{nozzle} T{tool}               ; app: heatManager(active tool, print temp) @0x9f3348
        T{tool}                              ; no clean: just grab it
    {% endif %}
    {% if mesh == 'off' %}
        { action_respond_info("Bed mesh strategy: none -- no mesh for this print, so no flow mesh either") }
    {% else %}
        _FF_FLOW_MESH_BEGIN FIRST_LAYER={layer}
    {% endif %}

# ---------------------------------------------------------------------------
# Bed mesh: one selector for which mesh prints use.
#   BED_MESH_MODE [MODE=auto|off|fixed|adaptive|thermal]  no argument: show it
#     auto      (the default) thermal, falling back to adaptive when there is
#               no map or the four probed points are more than auto_max_rms
#               (0.05 mm rms) off the best the map can do -- a state the map
#               never saw. Without a thermal map every print probes adaptive.
#     off       no mesh. The print runs on the homed plane, without the flow
#               mesh (it has nothing to absorb).
#     fixed     the saved MESH_DATA (the factory mesh, or yours saved over it).
#               With no MESH_DATA at all, the whole bed is probed into it --
#               kept for the session; SAVE_CONFIG after the print keeps it.
#     adaptive  probe only the area the file's objects and its prime tower
#               cover, plus adaptive_margin. [ff_print] reads the objects from
#               the file before it starts. A file without labelled objects
#               (Orca: Label objects / Exclude objects off) gets fixed instead.
#     thermal   probe the thermal map's four points and load the matching
#               effective mesh (THERMAL_MESH_APPLY with the thermal_* options
#               below); without a map, fixed.
# START_PRINT MESH=<mode> overrides it for one print. Like the other print
# choices it is not kept across a restart; to make one the default, restate
# the section at the end of printer.cfg, e.g. variable_mode: 'adaptive'.
# The flow mesh is separate: FLOW_MESH_TOGGLE, below.
# ---------------------------------------------------------------------------
[gcode_macro BED_MESH_MODE]
description: Choose the bed mesh prints use: auto, off, fixed (MESH_DATA), adaptive, thermal
variable_mode: 'auto'
variable_adaptive_margin: 16
variable_auto_max_rms: 0.05
variable_thermal_method: 'bilinear'
variable_thermal_match: 'absolute'
variable_thermal_correct: 'none'
gcode:
    {% set modes = ['auto', 'off', 'fixed', 'adaptive', 'thermal'] %}
    {% if 'MODE' in params %}
        {% set mode = params.MODE|string|lower %}
        {% if mode not in modes %}
            { action_raise_error("BED_MESH_MODE: MODE must be one of auto, off, fixed, adaptive, thermal") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=BED_MESH_MODE VARIABLE=mode VALUE="'{mode}'"
        { action_respond_info("Bed mesh mode: %s for the next print" % mode) }
    {% else %}
        { action_respond_info("Bed mesh mode: %s (auto, off, fixed, adaptive, thermal)"
                              % printer["gcode_macro BED_MESH_MODE"].mode) }
    {% endif %}

# _FF_MESH MODE=<mode> -- START_PRINT's mesh step, after the soak and the Z
# re-home, with every tool docked: the probe is on the carriage.
[gcode_macro _FF_MESH]
gcode:
    {% set sel = printer["gcode_macro BED_MESH_MODE"] %}
    {% set mode = params.MODE|default(sel.mode)|string|lower %}
    BED_MESH_CLEAR
    {% if mode == 'off' %}
        { action_respond_info("Bed mesh mode: OFF (no mesh for this print)") }
    {% elif mode == 'fixed' %}
        { action_respond_info("Bed mesh mode: FIXED (MESH_DATA)") }
        _FF_MESH_FIXED
    {% elif mode == 'adaptive' %}
        { action_respond_info("Bed mesh mode: ADAPTIVE (probing where the print is)") }
        _FF_MESH_ADAPTIVE
    {% elif mode == 'thermal' %}
        { action_respond_info("Bed mesh mode: THERMAL (four points matched against the thermal map)") }
        THERMAL_MESH_APPLY PREPARE=0 METHOD={sel.thermal_method} MATCH={sel.thermal_match} CORRECT={sel.thermal_correct} FALLBACK=NONE
        _FF_MESH_UNLESS_THERMAL ELSE=fixed
    {% elif mode == 'auto' %}
        { action_respond_info("Bed mesh mode: AUTO (thermal map; adaptive if it is missing or does not fit)") }
        THERMAL_MESH_APPLY PREPARE=0 METHOD={sel.thermal_method} MATCH={sel.thermal_match} CORRECT={sel.thermal_correct} MAX_RMS={sel.auto_max_rms} FALLBACK=NONE
        _FF_MESH_UNLESS_THERMAL ELSE=adaptive
    {% else %}
        { action_raise_error("bed mesh mode '%s': must be auto, off, fixed, adaptive or thermal" % mode) }
    {% endif %}

# The saved MESH_DATA. A printer that has none -- the factory mesh never
# imported, or the profile removed -- probes the whole bed into it, so the
# next print has one; saving it for good is SAVE_CONFIG's, which restarts
# Klipper and so cannot run mid-print.
[gcode_macro _FF_MESH_FIXED]
gcode:
    {% if 'MESH_DATA' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=MESH_DATA  ; app: heatBedThenPrintEddy @0x9f79e4
    {% else %}
        { action_respond_info("Bed mesh: no MESH_DATA saved -- probing the whole bed into it. Run SAVE_CONFIG after the print to keep it") }
        M106 P1 S0
        BED_MESH_CALIBRATE PROFILE=MESH_DATA
        SET_VELOCITY_LIMIT ACCEL=20000
    {% endif %}

# Probe only where the print is. [ff_print] defines the file's objects ahead
# of it, and _FF_MESH_ADAPTIVE_PROBE -- a separate macro, so it sees them --
# decides.
[gcode_macro _FF_MESH_ADAPTIVE]
gcode:
    FF_PRINT_DEFINE_OBJECTS
    _FF_MESH_ADAPTIVE_PROBE

# A file without labelled objects says nothing about where the print is, so
# it gets the fixed mesh rather than a probe of the whole bed. The prime tower
# comes from the file's own moves, unless something (a slicer calling
# DEFINE_PRIME_TOWER_OBJECT) already defined it.
[gcode_macro _FF_MESH_ADAPTIVE_PROBE]
gcode:
    {% set sel = printer["gcode_macro BED_MESH_MODE"] %}
    {% set names = printer.exclude_object.objects|map(attribute='name')|list %}
    {% if names|reject('equalto', 'PRIME_TOWER')|list|length == 0 %}
        { action_respond_info("Bed mesh: the file labels no objects (Orca: Label objects + Exclude objects) -- using the fixed mesh") }
        _FF_MESH_FIXED
    {% else %}
        {% if printer.ff_print.prime_tower_x is not none and 'PRIME_TOWER' not in names %}
            DEFINE_PRIME_TOWER_OBJECT
        {% endif %}
        M106 P1 S0
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={sel.adaptive_margin}
        SET_VELOCITY_LIMIT ACCEL=20000
    {% endif %}

# The second half of thermal and auto. A separate macro on purpose: Klipper
# renders a macro whole before running any of it, so the thermal result can
# only be read by one that starts after THERMAL_MESH_APPLY has finished.
# ELSE=fixed|adaptive is what runs when the match was not accepted.
[gcode_macro _FF_MESH_UNLESS_THERMAL]
gcode:
    {% set result = printer.ff_thermal_mesh.last_apply %}
    {% set other = params.ELSE|default('fixed')|string|lower %}
    {% if result.accepted %}
        { action_respond_info("Bed mesh: thermal match accepted (%.4f mm rms)" % (result.rms or 0.0)) }
    {% else %}
        { action_respond_info("Bed mesh: thermal not used (%s); %s instead" % (result.reason, other)) }
        {% if other == 'adaptive' %}
            _FF_MESH_ADAPTIVE
        {% else %}
            _FF_MESH_FIXED
        {% endif %}
    {% endif %}

# The adaptive mesh is START_PRINT's now (BED_MESH_MODE MODE=adaptive). Kept
# so a slicer profile that still calls it does not fail; it does nothing.
[gcode_macro ADAPTIVE_MESH]
description: Retired -- the adaptive mesh is part of START_PRINT (BED_MESH_MODE MODE=adaptive)
gcode:
    { action_respond_info("ADAPTIVE_MESH: nothing to do -- START_PRINT took the mesh (BED_MESH_MODE is %s); remove the call from the slicer's start G-code"
                          % printer["gcode_macro BED_MESH_MODE"].mode) }

# DEFINE_PRIME_TOWER_OBJECT X= Y= WIDTH= [DEPTH=] [BRIM=] [ROT=]
# Registers Orca's prime tower as an excluded object so the adaptive mesh
# covers it. The numbers Orca's start G-code expands can belong to another
# plate of a multi-plate project, so the file's own resolved values
# (printer.ff_print.prime_tower_*) win when it has them; the parameters are the
# fallback.
[gcode_macro DEFINE_PRIME_TOWER_OBJECT]
description: Register Orca's actual prime tower as an object for the mesh
gcode:
    {% set parsed = printer.ff_print %}
    {% set x = parsed.prime_tower_x|float if parsed.prime_tower_x is not none else params.X|float %}
    {% set y = parsed.prime_tower_y|float if parsed.prime_tower_y is not none else params.Y|float %}
    {% set width = parsed.prime_tower_width|float if parsed.prime_tower_width is not none else params.WIDTH|float %}
    {% set depth = parsed.prime_tower_depth|float if parsed.prime_tower_depth is not none else params.DEPTH|default(width)|float %}
    {% set raw_brim = parsed.prime_tower_brim|float if parsed.prime_tower_brim is not none else params.BRIM|default(0)|float %}
    {% set brim = [raw_brim, 0.0]|max %}
    {% set rot = parsed.prime_tower_rotation|float if parsed.prime_tower_rotation is not none else params.ROT|default(0)|float %}
    {% set safety = 1.0 %}

    {% if parsed.prime_tower_x is not none and params.X is defined and
          ((params.X|float - x)|abs > 0.001 or (params.Y|float - y)|abs > 0.001) %}
        { action_respond_info(
            "Prime Tower: replacing the start G-code's %.3f,%.3f with the active plate's %.3f,%.3f"
            % (params.X|float, params.Y|float, x, y)) }
    {% endif %}

    {% set cx = parsed.prime_tower_center_x|float if parsed.prime_tower_center_x is not none else x + width / 2.0 %}
    {% set cy = parsed.prime_tower_center_y|float if parsed.prime_tower_center_y is not none else y + depth / 2.0 %}
    {% set hx = width / 2.0 + brim + safety %}
    {% set hy = depth / 2.0 + brim + safety %}

    {% if parsed.prime_tower_outer_min_x is not none %}
        {% set xmin = parsed.prime_tower_outer_min_x|float - safety %}
        {% set xmax = parsed.prime_tower_outer_max_x|float + safety %}
        {% set ymin = parsed.prime_tower_outer_min_y|float - safety %}
        {% set ymax = parsed.prime_tower_outer_max_y|float + safety %}
    {% elif parsed.prime_tower_core_min_x is not none %}
        {% set xmin = parsed.prime_tower_core_min_x|float - brim - safety %}
        {% set xmax = parsed.prime_tower_core_max_x|float + brim + safety %}
        {% set ymin = parsed.prime_tower_core_min_y|float - brim - safety %}
        {% set ymax = parsed.prime_tower_core_max_y|float + brim + safety %}
    {% else %}
        ; No measured outline: a square that holds the tower at any rotation.
        {% set r = 1.414214 * ([hx, hy]|max) %}
        {% set xmin = cx - r %}
        {% set xmax = cx + r %}
        {% set ymin = cy - r %}
        {% set ymax = cy + r %}
    {% endif %}

    { action_respond_info(
        "Prime Tower: center %.3f,%.3f nominal %.3fx%.3f brim %.3f rotation %.1f, mesh bounds X %.3f..%.3f Y %.3f..%.3f"
        % (cx, cy, width, depth, brim, rot, xmin, xmax, ymin, ymax)) }
    EXCLUDE_OBJECT_DEFINE NAME=PRIME_TOWER CENTER={cx},{cy} POLYGON=[[{xmin},{ymin}],[{xmax},{ymin}],[{xmax},{ymax}],[{xmin},{ymax}],[{xmin},{ymin}]]

# END_PRINT -- the app's single exit sequence @0x7a25f0, run for BOTH cancel
# and normal completion. FF_AFTER_PRINT_END calls it when the job leaves the
# printing state, CANCEL_PRINT after the builtin, and a slicer whose machine
# end G-code calls END_PRINT lands in the same block.
[gcode_macro END_PRINT]
gcode:
    FLOW_MESH_STOP                       ; back to standard mesh (silent if off)
    TURN_OFF_HEATERS                     ; hotends + bed + chamber
    M106 S0
    M106 P2 S0
    M106 P3 S0
    SET_VELOCITY_LIMIT ACCEL=5000
    G92 E0
    G1 E-1 F300
    G92 E0
    M400
    {% set z = printer.toolhead.position.z %}
    {% if 'z' in printer.toolhead.homed_axes %}
        G90
        {% if z < 100.0 %}
            G1 Z150 F1800                ; bed presentation drop (app: 150/200/256.8)
        {% elif z < 150.0 %}
            G1 Z200 F1800
        {% elif z < 256.8 %}
            G1 Z256.8 F1800
        {% endif %}
    {% endif %}
    G90
    M106 S0
    ; No fan/PA/mute overrides to undo. All three were line-rewriting state in
    ; FlashForge's virtual_sdcard: SET_FAN_M106[P2] added FACTOR*255/100 to
    ; each M106 it passed through, SET_PA_ADVANCE replaced the file's own
    ; SET_PRESSURE_ADVANCE with a per-tool value, and mute clamped max_accel
    ; (via M204 S61166, never a MUTE_MODE_DISABLE command -- that line was
    ; wrong even against the fork). Upstream rewrites nothing, so the file's
    ; own M106 and SET_PRESSURE_ADVANCE apply as written and there is no
    ; override to clear. If a UI ever wants live fan/PA/quiet overrides they
    ; are new features, not end-of-print cleanup.
    M220 S100
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=20000
    M400
    G92 E0
    BED_MESH_CLEAR
    CLEAR_PAUSE
    M82
    ; Needs a known position. Reached from CANCEL_PRINT after an error the
    ; axes may be unhomed, and raising here would abort the rest of the
    ; cleanup. Skipping is safe: the G28 wrapper docks a mounted tool before
    ; homing Z on the next job.
    {% if 'xyz' in printer.toolhead.homed_axes %}
        TOOLCHANGE_PARK                  ; dock the mounted tool (no-op if none)
    {% endif %}
    ; The app's exit block cleared Z with SET_GCODE_OFFSET Z=0 MOVE=1, which
    ; had two problems once the layers came apart: MOVE=1 issues a real Z
    ; move and cartesian.check_move refuses one on an unhomed Z (a failed
    ; `G28 Z` earlier in the job made END_PRINT raise HERE, skipping M18, the
    ; idle-timeout reset and the `ended` flag -- which then let
    ; FF_AFTER_PRINT_END run the whole block again), and Z=0 cannot tell the
    ; job term from the operator's babystep, so it wiped both. CLEAR=1 drops
    ; the job term alone and moves nothing, so it is safe unhomed.
    TOOLCHANGE_SET_PRINT_OFFSET CLEAR=1
    M18
    SET_IDLE_TIMEOUT TIMEOUT=600
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=ended VALUE=1

# Per-job state. Never called -- a gcode_macro is the only thing a macro can
# write to and read back, so job flags live in one here.
[gcode_macro _FF_JOB]
# Escape hatch for the calibration gate (START_PRINT and the automatic entry
# point both refuse on an uncalibrated machine). Only for deliberate tests:
#   SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=allow_uncalibrated VALUE=1
variable_allow_uncalibrated: 0
# Set by END_PRINT so the automatic FF_AFTER_PRINT_END does not run the exit
# block a second time after a slicer footer or CANCEL_PRINT already did.
variable_ended: 0
gcode:

# The exit sequence runs for every cancel. There is no job origin to check:
# HelixScreen starts prints through Moonraker (SDCARD_PRINT_FILE) exactly as
# Mainsail does, and the one client that cancelled with its own motion cleanup
# -- FlashForge's touchscreen app @0x7a0b24 -- is not a UI this mod ships.
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT
    END_PRINT

# ---------------------------------------------------------------------------
# PAUSE -- mirrors the app: save tool temps, SAVE via pause_resume, hotends
# OFF (bed/chamber stay on), park lift, long idle timeout.
# ---------------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_t0: 0.0
variable_t1: 0.0
variable_t2: 0.0
variable_t3: 0.0
gcode:
    {% if printer.pause_resume.is_paused %}
        { action_respond_info("already paused") }
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT=864000
        M400
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t0 VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t1 VALUE={printer.extruder1.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t2 VALUE={printer.extruder2.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=t3 VALUE={printer.extruder3.target}
        BASE_PAUSE                       ; stops SD + saves position/state
        M104 S0 T0
        M104 S0 T1
        M104 S0 T2
        M104 S0 T3
        {% if 'z' in printer.toolhead.homed_axes %}
            {% set z = printer.toolhead.position.z %}
            {% set park = [z + 10.0, 256.0]|min %}
            G90
            G1 Z{park} F500              ; park lift (app formula unrecovered)
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# RESUME -- reheat what PAUSE turned off, wait for arrival, then let
# pause_resume restore position (recover_velocity 50) and continue.
# ---------------------------------------------------------------------------
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        { action_respond_info("not paused") }
    {% else %}
        {% set p = printer["gcode_macro PAUSE"] %}
        {% if p.t0 > 0 %} M104 S{p.t0} T0 {% endif %}
        {% if p.t1 > 0 %} M104 S{p.t1} T1 {% endif %}
        {% if p.t2 > 0 %} M104 S{p.t2} T2 {% endif %}
        {% if p.t3 > 0 %} M104 S{p.t3} T3 {% endif %}
        {% if p.t0 > 0 %} M109 S{p.t0} T0 {% endif %}
        {% if p.t1 > 0 %} M109 S{p.t1} T1 {% endif %}
        {% if p.t2 > 0 %} M109 S{p.t2} T2 {% endif %}
        {% if p.t3 > 0 %} M109 S{p.t3} T3 {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT=864000
        {% if printer.ff_toolchange.current_tool >= 0 %}
            FF_RUNOUT_ARM                ; app re-arms the clog sensor after
                                         ; every resume (@0x7a0854)
        {% endif %}
        BASE_RESUME
    {% endif %}

# ---------------------------------------------------------------------------
# Mesh probing travel. Klipper lifts to one fixed Z before every mesh point
# and retracts a fixed sample_retract_dist between samples; with the contact
# probe descending at 3 mm/s that Z travel is most of BED_MESH_CALIBRATE's
# time. Between samples at one point this lifts only release_distance +
# release_margin above the previous trigger -- the height from which the
# probe is ready to trigger again, plus 0.2 mm -- and before moving to the
# next point at least min_travel_lift (1 mm), because a warped plate can be
# higher there. X/Y travel runs at
# travel_speed (500 mm/s, the tool change's fast_feed) and travel_accel
# (20000, the print acceleration START_PRINT sets; the app probed at 2000),
# restored when the probe run ends. Z speeds are the [probe] section's, and Z
# acceleration stays max_z_accel's.
#
# Sampling: each point is touched `samples` times (2, in place of
# FlashForge's 3). If they are further apart than [probe] samples_tolerance
# (0.02), it touches up to tiebreak_samples more (1) and keeps the closest
# pair that agrees; only when none does is the point started over, counting
# against samples_tolerance_retries. PROBE, homing and the tool calibrations
# keep 3 and Klipper's own sampling.
#
# The first move goes to first_move_z, and a target under
# low_height_threshold falls back to recovery_move_z. That threshold is -2:
# the travel lift is relative to the last touch, so on a plate sitting
# around Z 0 a 1 mm lift lands near Z 1, and a threshold of 1 sent most
# points to Z 3 instead. Only a touch below Z -3 -- something badly wrong --
# recovers now.
#
# release_distance is measured, not shipped: run FF_PROBE_RELEASE_TEST SAVE=1
# over the bed, then SAVE_CONFIG. The Creator 5's probe line is a momentary
# pulse from the eboard's eddy tap detection, not a held switch, so the test
# finds the lowest start height whose touches still land where touches from
# 3 mm do. Until then it is 1.8, a 2 mm lift. It must stay out of this
# section, or SAVE_CONFIG refuses to save it.
# Needs [bed_mesh], which printer.mesh.cfg provides.
# ---------------------------------------------------------------------------
[ff_bed_mesh]
first_move_z: 5.0
release_margin: 0.2
min_travel_lift: 1.0
travel_speed: 500
travel_accel: 20000
samples: 2
tiebreak_samples: 1
low_height_threshold: -2.0
recovery_move_z: 3.0

# ---------------------------------------------------------------------------
# Flow mesh -- a second bed-mesh strategy. Instead of moving the nozzle with
# the plate, the first layers keep the nozzle on the flat G-code plane and
# absorb the plate's unevenness in their thickness, with the extrusion scaled
# to match: thicker over a low spot, thinner over a high one. A layer is never
# thinner than min_thickness or thicker than max_thickness (unset: the
# mounted nozzle's diameter); where the gap is outside them the nozzle
# follows the mesh just far enough to hold the limit, and what is left over
# goes into the next layer. Each layer flattens what it can, until the
# remaining mesh is flat and printing carries on at normal flow on the flat
# plane. bed_mesh keeps the mesh loaded throughout (the bed guard and the
# screens read it).
#   FLOW_MESH_TOGGLE [ENABLE=0|1]   which strategy the next print uses
#   FLOW_MESH_STATUS                layer, mesh left, flat since layer N
# START_PRINT starts it, when enabled, after the first tool's clean, with its
# LAYER= as the first layer's height (without one it prints with the
# standard mesh and says why); BED_MESH_MODE off leaves it off, having no mesh
# to absorb. END_PRINT stops it. Off by default. Needs bed_mesh fade off,
# which it is as FlashForge ships printer.mesh.cfg.
# ---------------------------------------------------------------------------
[ff_flow_mesh]
min_thickness: 0.1
#max_thickness: 0.4
split_distance: 2.0

[gcode_macro FLOW_MESH_TOGGLE]
description: Choose the bed mesh strategy (1: absorb it in first-layer flow; 0: standard)
variable_enabled: 0
gcode:
    {% if 'ENABLE' in params %}
        {% set next = params.ENABLE|int %}
        {% if next != 0 and next != 1 %}
            { action_raise_error("FLOW_MESH_TOGGLE: ENABLE must be 0 or 1") }
        {% endif %}
    {% else %}
        {% set next = 0 if printer["gcode_macro FLOW_MESH_TOGGLE"].enabled|int else 1 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=FLOW_MESH_TOGGLE VARIABLE=enabled VALUE={next}
    {% if next %}
        { action_respond_info("Flow mesh ENABLED: the next print keeps the nozzle flat and absorbs the mesh in its first layers") }
    {% else %}
        { action_respond_info("Flow mesh DISABLED: the next print follows the mesh with the nozzle") }
    {% endif %}

[gcode_macro _FF_FLOW_MESH_BEGIN]
gcode:
    {% set first = params.FIRST_LAYER|default(0)|float %}
    {% if printer["gcode_macro FLOW_MESH_TOGGLE"].enabled|int and first <= 0 %}
        { action_respond_info("Bed mesh strategy: standard -- the flow mesh needs the first layer height, and the print start gave none (LAYER=)") }
    {% elif printer["gcode_macro FLOW_MESH_TOGGLE"].enabled|int %}
        FLOW_MESH_START FIRST_LAYER={first}
    {% else %}
        { action_respond_info("Bed mesh strategy: standard (nozzle follows the mesh; FLOW_MESH_TOGGLE ENABLE=1 for flow mesh)") }
    {% endif %}

# ---------------------------------------------------------------------------
# Thermal mesh map. The bed changes shape with bed AND chamber temperature;
# THERMAL_MESH_SWEEP probes a full mesh at every combination of the two,
# THERMAL_MESH_ANALYZE picks the four mesh points that move the most, and
# THERMAL_MESH_APPLY probes only those and loads a mesh blended from the
# closest matches. docs/bed-mesh.md has the procedure. The map is
# thermal_mesh.json beside printer.cfg. Nothing runs unless asked.
#
# before/after_sample_gcode wrap every full mesh in the sweep and the point
# probe in APPLY, so both see the bed the same way: the same parking, the same
# Z homing after the soak, the same probing travel as every mesh.
# ---------------------------------------------------------------------------
[ff_thermal_mesh]
bed_heater: heater_bed
chamber_heater: chamber_heater
bed_tolerance: 1.0
chamber_tolerance: 2.0
heat_timeout: 5400
max_samples: 6
min_point_spacing: 60
before_sample_gcode:
    TOOLCHANGE_PARK
    G28 Z
    BED_MESH_CLEAR
    M106 P1 S0
after_sample_gcode:
    SET_VELOCITY_LIMIT ACCEL=20000
    G1 Z10 F1200

# ---------------------------------------------------------------------------
# Automatic print lifecycle -- the two entry points [ff_print] calls. It holds
# no policy of its own: redefine these macros, or point [ff_print]
# before_macro:/after_macro: at your own. What it derived is readable as
# printer.ff_print.* (filename, origin, active, tool, nozzle, bed, layer).
#
# FF_BEFORE_PRINT_START runs BEFORE the file is fed, which is the point: the
# stock slicer profile's start G-code has no G28, so its first move
# (G1 Z5 F2400) requires an already-homed machine.
#   ORIGIN       SDCARD_PRINT_FILE (Moonraker/Mainsail) or M23 (touchscreen).
#   BED TOOL NOZZLE LAYER  derived from the file's own M140/M104/Tn/;HEIGHT:
#                and passed to START_PRINT verbatim. TOOLS is NOT derived, so
#                a print prepared this way gates the initial tool only; pass
#                TOOLS= yourself for the stronger multi-tool gate.
# ---------------------------------------------------------------------------
[ff_print]
#before_macro: FF_BEFORE_PRINT_START
#after_macro: FF_AFTER_PRINT_END
#hook_commands: SDCARD_PRINT_FILE, M23

[gcode_macro FF_BEFORE_PRINT_START]
# ON by default, so the Orca profile stays STOCK. FlashForge's own start block
# calls no START_PRINT and prepares nothing -- M140 and M104 without waiting,
# fans, M191, then `G1 Z5 F2400` as its first motion on an unhomed machine.
# This runs the whole of START_PRINT before that block's first line.
#
# Set to 0 if your profile calls START_PRINT itself: preparing twice misplaces
# nothing, but it re-homes and re-purges every tool for no reason. Set it to 0
# as well for a profile that homes for itself -- a generic Orca block runs G28
# after its M140/M104, and our G28 wrapper docks a mounted tool before homing
# Z, so it would dock the tool this just grabbed.
variable_prepare: 1
# Kept from when FlashForge's touchscreen ran its own prepare before M23. That
# binary is replaced and HelixScreen starts prints through Moonraker, so
# little should reach M23 at all; set to 1 if something in your setup does and
# does not prepare for itself. NOTE: this skips only the PREPARE --
# _FF_PREFLIGHT runs for every origin.
variable_prepare_on_m23: 0
gcode:
    {% set origin = params.ORIGIN|default('')|string %}
    {% set me = printer["gcode_macro FF_BEFORE_PRINT_START"] %}
    ; Refuse an uncalibrated machine before the file is even loaded, as the old
    ; SDCARD_PRINT_FILE wrapper did. START_PRINT calls it again with the tool
    ; list -- but START_PRINT does not always run (see prepare / prepare_on_m23
    ; below), and this gate must. It only raises; it moves and heats nothing,
    ; so there is no origin for which running it is wrong. An M23 print used to
    ; skip it, and with it the check that keeps the nozzle out of the plate.
    _FF_PREFLIGHT
    ; Scope the end-of-job flag to THIS job. END_PRINT sets it so a slicer
    ; footer cannot make the exit block run twice, and FF_AFTER_PRINT_END
    ; clears it -- but that only runs for a job ff_print announced, so an
    ; END_PRINT or CANCEL_PRINT typed at the console while idle would latch it
    ; and silently suppress the NEXT job's exit block: heaters left at target,
    ; tool never docked, Z offset never reset.
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=ended VALUE=0
    ; No other per-job flags to clear: the refuelling / FFM / extruder-remap
    ; state the touchscreen carried between jobs lived in FlashForge's
    ; virtual_sdcard, and we ship the upstream one, which has none of it.
    {% if not me.prepare %}
        ; explicit path: the slicer profile calls START_PRINT itself
    {% elif origin == 'M23' and not me.prepare_on_m23 %}
        { action_respond_info("ff_print: touchscreen print, the app prepares itself") }
    {% else %}
        START_PRINT {rawparams}
    {% endif %}

# FF_AFTER_PRINT_END -- called once the job leaves the printing state.
#   STATE      complete | cancelled | error
# The exit block is skipped when a slicer footer's END_PRINT or CANCEL_PRINT
# already ran it -- END_PRINT sets _FF_JOB.ended itself.
[gcode_macro FF_AFTER_PRINT_END]
gcode:
    {% if not printer["gcode_macro _FF_JOB"].ended %}
        END_PRINT
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FF_JOB VARIABLE=ended VALUE=0
